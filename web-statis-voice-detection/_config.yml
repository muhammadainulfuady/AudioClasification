# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "Kelompok 4: Klasifikasi Audio Suara Manusia Asli dan Suara Hasil AI / Voice Changer"
author: "24-009 Muhammad Ainul Fuady | 24-010 Irwan Dwi Mukhlisin | 24-105 Fikri Mutawakkil"
logo: logo.png
copyright: "2026, Kelompok 4 Proyek Sains Data"

# Enable MyST extensions for math and figure formatting
myst_enable_extensions:
  - dollarmath
  - amsmath
  - colon_fence
  - deflist
  - html_image

# Execution settings:
# Disetel 'off' karena seluruh visualisasi, tabel, dan artefak CRISP-DM sudah pre-rendered
# sehingga build GitHub Actions dapat berjalan sangat cepat dan andal tanpa butuh audio raw.
execute:
  execute_notebooks: "off"

# Information about where the book exists on the web
repository:
  url: https://github.com/muhammadainulfuady/AudioClasification
  path_to_book: web-statis-voice-detection
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true

sphinx:
  config:
    html_theme_options:
      show_toc_level: 2
