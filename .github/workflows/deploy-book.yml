name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web-statis-voice-detection/requirements.txt

      - name: Build Jupyter Book
        run: |
          cd web-statis-voice-detection
          jupyter-book build .
          touch _build/html/.nojekyll
          echo "=== Menampilkan file yang berhasil di-build ==="
          ls -la _build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-statis-voice-detection/_build/html
          enable_jekyll: false
