services:
  audio-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice-authenticity-detector:latest
    container_name: voice_detector_app
    restart: unless-stopped
    ports:
      - "2006:2006"
    environment:
      - PORT=2006
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/tmp/matplotlib

